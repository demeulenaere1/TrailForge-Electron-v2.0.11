<!doctype html><html><head><meta charset="utf-8"><title>TrailForge 2.0.11</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="styles.css"></head><body><header><b>TRAILFORGE <small>2.0.11</small></b><div><button id="libraryToggle">▶ Library</button><button id="new">New</button><button id="print">Print Preview</button><button id="gpx">GPX</button><button id="kml">KML</button><button id="earth">Google Earth</button></div></header><main><aside id="library" class="collapsed"><button id="libraryTab">▶</button><div id="libraryContent"><h2>Route Library</h2><input id="libSearch" placeholder="Search routes"><div class="filters"><button data-filter="all" class="active">All</button><button data-filter="favorite">★</button><button data-filter="planned">Planned</button><button data-filter="completed">Completed</button></div><div id="routes"></div></div></aside><aside class="editor"><div id="empty"><h2>No Route Selected</h2><button id="emptyNew">New Route</button><button id="emptyLibrary">Open Library</button></div><div id="routeEditor"><input id="name" class="full"><div class="row"><input id="region" placeholder="Region"><select id="category"><option>Day Hike</option><option>Backpacking</option><option>Peak Bagging</option><option>Trail Run</option><option>Snowshoe</option><option>Other</option></select></div><input id="tags" class="full" placeholder="Tags"><textarea id="description" placeholder="Notes"></textarea><div class="row"><button id="favorite">☆ Favorite</button><button id="completed">Mark completed</button><button id="duplicate">Duplicate</button><button id="deleteRoute">Delete Route</button></div><small id="saved"></small><section><div class="row"><input id="placeSearch" placeholder="Find trailheads, peaks, lakes"><button id="search">Search</button></div><div id="results"></div></section><section><h3>Route</h3><p class="hint">Left-click routes automatically. Right-click for manual route or POI.</p><div class="row"><button id="undo">Undo</button><button id="redo">Redo</button><button id="retry">Retry</button><button id="clear">Clear</button></div><div id="summary"></div></section><section class="stats"><div>Distance<strong id="distance">0.00 mi</strong></div><div>Gain<strong id="gain">--</strong></div><div>Loss<strong id="loss">--</strong></div></section><section><h3>Points of Interest</h3><div class="row"><button id="refreshPois">Discover Nearby POIs</button><button id="poiDiagnostics">POI Diagnostics</button></div><small id="poiStatus">No POI search run yet.</small><div id="poiList"></div></section><section><h3>Roadbook</h3><div id="roadbook"></div></section></div></aside><div class="mapPane"><div id="map"></div><div id="toast">Ready</div><div id="profilePane"><b>Elevation Profile</b><canvas id="profile"></canvas></div></div></main><div id="menu"><button id="manualHere">Add manual route point</button><input id="poiName" placeholder="POI name"><select id="poiType"><option>Trailhead</option><option>Junction</option><option>Lake</option><option>Water</option><option>Pass</option><option>Summit</option><option>Camp</option><option>Viewpoint</option><option>Custom</option></select><button id="poiHere">Add POI</button></div><div id="poiMenu"><button id="poiEdit">Edit POI</button><button id="poiConvert">Convert to Manual</button><button id="poiDelete">Delete POI</button></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
